<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理監事活動報帳 | 苗栗IMC 第15屆</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">
<style>.pill.待處理{background:var(--warn-bg);color:var(--warn)}.pill.已入帳{background:var(--ok-bg);color:var(--ok)}select.si,input.si{width:100%}</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <img src="assets/imc-logo.png" alt="苗栗IMC 社徽" onerror="this.style.display='none'">
    <div class="t"><div class="org">社團法人苗栗縣國際工商經營研究社</div><h1>理監事活動報帳</h1></div>
    <img src="assets/15th-logo.png" alt="第15屆" onerror="this.style.display='none'">
  </div>
</div><hr class="rule"></header>

<main class="wrap">
  <div class="card">
    <h2>活動辦完後，請在這裡先報帳</h2>
    <div class="muted">先把支出登記上來，財務長就能提早掌握各活動花了多少，並安排撥款或入帳。報帳科目請依「財務收支預算科目」選擇。紙本發票或收據請另交財務長留存。</div>
  </div>

  <form class="card" id="f" autocomplete="off">
    <h2>登記支出</h2>
    <label class="f" for="who">1. 報帳人姓名</label>
    <input type="search" id="who" placeholder="輸入姓名關鍵字，例如：陳" autocomplete="off" required>
    <div class="sug hide" id="sug" role="listbox"></div>

    <label class="f" for="act">2. 活動名稱</label>
    <input type="text" id="act" maxlength="100" placeholder="例如：10月例會、交接典禮、幹部訓練營" required>

    <label class="f" for="d">3. 支出日期</label>
    <input type="date" id="d" required>

    <label class="f" for="bud">4. 預算科目（依財務收支預算科目）</label>
    <select id="bud" required><option value="">載入中…</option></select>
    <div class="hint" id="budhint"></div>

    <label class="f" for="ds">5. 支出內容</label>
    <input type="text" id="ds" maxlength="200" placeholder="例如：場地費、便當 30 份、花籃" required>

    <label class="f" for="amt">6. 金額（元）</label>
    <input type="text" id="amt" inputmode="numeric" placeholder="例如 3200" required>

    <label class="f">7. 付款情形</label>
    <div class="seg" id="how">
      <label><input type="radio" name="h" value="先墊付" checked><span>我先墊付<br><small>請財務長撥還</small></span></label>
      <label><input type="radio" name="h" value="公款已支付"><span>已用公款支付<br><small>社裡已付款</small></span></label>
      <label><input type="radio" name="h" value="其他"><span>其他</span></label>
    </div>

    <label class="f" for="cp">收款對象／廠商（選填）</label>
    <input type="text" id="cp" maxlength="100" placeholder="例如：○○餐廳">

    <label class="f" for="v">憑證</label>
    <select id="v"><option>統一發票</option><option>收據</option><option>其他單據</option><option>尚無憑證（稍後補）</option></select>

    <label class="f" for="nt">備註（選填）</label>
    <input type="text" id="nt" maxlength="200">

    <button class="btn" id="go" type="submit">送出報帳</button>
    <div id="out" role="status" aria-live="polite"></div>
  </form>

  <div class="card hide" id="mine">
    <h2>我的報帳紀錄</h2>
    <div id="mineList"></div>
  </div>
</main>

<script src="assets/api.js"></script>
<script>
const $=id=>document.getElementById(id);
let NAMES=[],ITEMS=[];
async function init(){
  $('d').value=todayTW();
  try{
    const [names,items]=await Promise.all([rpc('imc_names'),rpc('imc_claim_items')]);
    NAMES=names.map(x=>x.name);ITEMS=items;
    const by={};items.forEach(i=>{(by[i.category]=by[i.category]||[]).push(i)});
    $('bud').innerHTML='<option value="">— 請選擇預算科目 —</option>'+Object.keys(by).map(c=>`<optgroup label="${esc(c)}">`+by[c].map(i=>`<option value="${i.id}">${esc(i.item)}</option>`).join('')+'</optgroup>').join('');
    $('budhint').textContent='科目與財務長的「收支預算」一致，選不到合適的請選最接近者，財務長入帳時可調整。';
  }catch(e){$('out').innerHTML=`<div class="msg err">${esc(e.message)}</div>`;$('bud').innerHTML='<option value="">無法載入</option>'}
  try{const s=localStorage.getItem('imc_claimer');if(s){$('who').value=s;loadMine()}}catch(e){}
}
function sug(){
  const q=$('who').value.trim(),box=$('sug');
  if(!q){box.classList.add('hide');$('mine').classList.add('hide');return}
  const m=NAMES.filter(n=>n.includes(q));
  if(m.length===1&&m[0]===q){box.classList.add('hide');loadMine();return}
  box.innerHTML=m.length?m.slice(0,30).map(n=>`<button type="button" role="option">${esc(n)}</button>`).join(''):'<div class="muted" style="padding:10px">名單中找不到，請確認姓名或洽財務長</div>';
  box.classList.remove('hide');$('mine').classList.add('hide');
}
$('who').addEventListener('input',sug);
$('sug').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('who').value=b.textContent;$('sug').classList.add('hide');loadMine()});
const bname=id=>{const i=ITEMS.find(x=>x.id==id);return i?i.category+'｜'+i.item:''};
async function loadMine(){
  const n=$('who').value.trim();
  if(!NAMES.includes(n)){$('mine').classList.add('hide');return}
  try{localStorage.setItem('imc_claimer',n)}catch(e){}
  try{
    const L=await rpc('imc_claim_my',{n});
    $('mine').classList.remove('hide');
    $('mineList').innerHTML=L.length?L.map(r=>`<div class="rec"><div class="row"><span class="pill ${esc(r.status)}">${esc(r.status)}</span><b>${money(r.amount)}</b><span class="muted">${esc(r.spend_date)}</span></div><div>${esc(r.activity)}｜${esc(r.description)}</div>${r.review_note?`<div class="muted">財務長備註：${esc(r.review_note)}</div>`:''}${r.status==='待處理'?`<button type="button" class="sm" data-c="${r.id}" style="margin-top:6px">撤回這筆</button>`:''}</div>`).join(''):'<div class="muted">還沒有報帳紀錄。</div>';
  }catch(e){$('mineList').innerHTML=`<div class="msg err">${esc(e.message)}</div>`;$('mine').classList.remove('hide')}
}
$('mineList').addEventListener('click',async e=>{const b=e.target.closest('button[data-c]');if(!b||!confirm('確定撤回這筆報帳？'))return;
  try{await rpc('imc_claim_cancel',{n:$('who').value.trim(),i:Number(b.dataset.c)});await loadMine()}catch(err){alert(err.message)}});
$('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const out=$('out');out.innerHTML='';
  const n=$('who').value.trim();
  if(!NAMES.includes(n)){out.innerHTML='<div class="msg err">請輸入姓名並從跳出的名單點選自己</div>';return}
  const a=Number(String($('amt').value).replace(/[,，\s]/g,''));
  if(!(a>0)){out.innerHTML='<div class="msg err">金額請填大於 0 的數字</div>';return}
  if(!$('bud').value){out.innerHTML='<div class="msg err">請選擇預算科目</div>';return}
  $('go').disabled=true;$('go').textContent='送出中…';
  try{
    await rpc('imc_claim_submit',{n,act:$('act').value.trim(),d:$('d').value,b:Number($('bud').value),ds:$('ds').value.trim(),a,how:document.querySelector('input[name=h]:checked').value,cp:$('cp').value.trim(),v:$('v').value,nt:$('nt').value.trim()});
    out.innerHTML=`<div class="msg ok"><b>已送出報帳</b>（${money(a)}）。財務長會依預算科目入帳，您可以在下方「我的報帳紀錄」查看進度。同一活動有多筆支出，請分筆登記。</div>`;
    ['ds','amt','cp','nt'].forEach(k=>$(k).value='');
    await loadMine();
  }catch(e){out.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
  finally{$('go').disabled=false;$('go').textContent='送出報帳'}
});
init();
</script>
</body>
</html>
