<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>財務長審核 | 苗栗IMC 第15屆</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top"><div class="wrap wide">
  <div class="brand">
    <img src="assets/imc-logo.png" alt="苗栗IMC 社徽" onerror="this.style.display='none'">
    <div class="t"><div class="org">社團法人苗栗縣國際工商經營研究社</div><h1>財務長・社費審核</h1></div>
    <button class="sm hide" id="logout">登出</button>
  </div>
</div><hr class="rule"></header>

<main class="wrap wide">
  <form class="card" id="login" style="max-width:420px;margin-inline:auto">
    <h2>財務長登入</h2>
    <label class="f" for="pw">密碼</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" type="submit">登入</button>
    <div id="lerr"></div>
  </form>

  <section id="app" class="hide">
    <div class="tiles" id="tiles"></div>
    <div class="bar" title="已確認金額 / 應收金額"><i id="barfill" style="width:0"></i></div>
    <div class="muted" id="barlab" style="margin-top:6px"></div>

    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="pending" aria-selected="true">待審核</button>
      <button role="tab" data-t="all" aria-selected="false">全部紀錄</button>
      <button role="tab" data-t="matrix" aria-selected="false">繳費總表</button>
      <button role="tab" data-t="add" aria-selected="false">代登收款</button>
      <button role="tab" data-t="set" aria-selected="false">設定</button>
    </div>

    <div id="v-pending"></div>

    <div id="v-all" class="hide">
      <div class="card row">
        <select id="fs" class="grow"><option value="">全部狀態</option><option>待審核</option><option>已確認</option><option>退回</option></select>
        <input type="search" id="fq" class="grow" placeholder="搜尋姓名、後5碼、備註">
        <button class="sm" id="csv">匯出 CSV</button>
      </div>
      <div class="tw" style="margin-top:12px"><table class="t" id="tAll"></table></div>
    </div>

    <div id="v-matrix" class="hide">
      <div class="card row">
        <select id="mf" class="grow"><option value="">全部社友</option><option value="unpaid">尚有未繳</option><option value="done">已繳齊</option><option value="pend">有待審核</option></select>
        <input type="search" id="mq" class="grow" placeholder="搜尋姓名">
        <button class="sm" id="mcsv">匯出 CSV</button>
        <button class="sm" onclick="window.print()">列印</button>
      </div>
      <div class="tw" style="margin-top:12px"><table class="t" id="tMx"></table></div>
      <p class="muted noprint">「已確認」才算收到；「待審核」是社友已回報、財務長尚未確認。名單中停用的社友不計入應收。</p>
    </div>

    <div id="v-add" class="hide">
      <form class="card" id="addf" style="max-width:560px">
        <h2>代登收款（現場收現、或已查帳直接入帳）</h2>
        <label class="f" for="an">社友</label><input type="text" id="an" list="anl" placeholder="輸入姓名關鍵字" autocomplete="off" required><datalist id="anl"></datalist>
        <label class="f">項目</label><div class="opts" id="aitems"><div class="muted">先選社友，系統會依其類別列出項目與金額。</div></div>
        <div class="total"><span>合計</span><b id="asum">NT$ 0</b></div>
        <label class="f">方式</label>
        <div class="seg"><label><input type="radio" name="am" value="現金" checked><span>現金</span></label><label><input type="radio" name="am" value="匯款"><span>匯款</span></label><label><input type="radio" name="am" value="其他"><span>其他</span></label></div>
        <label class="f" for="al5">匯出帳號後5碼（匯款才填）</label><input type="text" id="al5" maxlength="5" inputmode="numeric">
        <label class="f" for="ad">收款日期</label><input type="date" id="ad" required>
        <label class="f" for="ant">備註</label><input type="text" id="ant" maxlength="200">
        <button class="btn" type="submit">登錄並直接確認</button>
        <div id="aout"></div>
      </form>
    </div>

    <div id="v-set" class="hide">
      <div class="card" style="max-width:560px">
        <h2>匯款資訊（社友回報頁會顯示）</h2>
        <textarea id="payinfo" rows="4" maxlength="500"></textarea>
        <button class="btn" id="savepay">儲存匯款資訊</button><div id="pout"></div>
      </div>
      <div class="card">
        <h2>社友類別與年費設定</h2>
        <div class="muted">A 原社友 12,000｜B 原社友直系寶眷 6,000｜C 新社友 12,000＋入社費 5,000｜D 新社友直系寶眷 6,000＋入社費 5,000（另加社館基金 1,000）。未足一年或同公司多人入社有優惠者，在「年費調整」填實收年費。變更後立即生效。</div>
        <div class="row" style="margin:10px 0"><input type="search" id="sq" class="grow" placeholder="搜尋姓名"><label class="opt" style="min-height:42px"><input type="checkbox" id="sact"><span class="l">只看停用</span></label></div>
        <div class="tw"><table class="t" id="tSet"></table></div>
        <div id="sout"></div>
      </div>
      <form class="card" id="mf2" style="max-width:560px">
        <h2>新增社友</h2>
        <label class="f" for="mn">姓名</label><input type="text" id="mn" required>
        <label class="f" for="mt">類別</label>
        <select id="mt"><option value="A">A 原社友</option><option value="B">B 原社友直系寶眷</option><option value="C">C 新社友</option><option value="D">D 新社友直系寶眷</option></select>
        <button class="btn" type="submit">新增</button><div id="mout"></div>
      </form>
      
    </div>
  </section>
</main>

<script src="assets/api.js"></script>
<script>
const $=id=>document.getElementById(id);
let PW='',FEES=[],LABEL={},KIND={},AMT={},DUES=[],MEM=[],TAB='pending';
try{PW=sessionStorage.getItem('imc_fin')||''}catch(e){}

$('login').addEventListener('submit',async e=>{
  e.preventDefault();PW=$('pw').value;$('lerr').innerHTML='';
  try{await boot();try{sessionStorage.setItem('imc_fin',PW)}catch(_){}}
  catch(err){PW='';$('lerr').innerHTML=`<div class="msg err">${esc(err.message)}</div>`}
});
$('logout').addEventListener('click',()=>{PW='';try{sessionStorage.removeItem('imc_fin')}catch(e){}location.reload()});

async function boot(){
  FEES=await rpc('imc_fees');FEES.forEach(f=>{LABEL[f.code]=f.label;KIND[f.code]=f.kind;AMT[f.code]=f.amount});
  await reload();
  $('login').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');
  $('payinfo').value=await rpc('imc_pay_info');
  $('ad').value=todayTW();
  show(TAB);
}
async function reload(){
  [DUES,MEM]=await Promise.all([rpc('imc_dues_list',{p:PW}),rpc('imc_admin_members',{p:PW})]);
  $('anl').innerHTML=MEM.filter(m=>m.active).map(m=>`<option value="${esc(m.name)}">`).join('');
  tiles();show(TAB);
}
const needSum=m=>m.need.reduce((s,x)=>s+x.amount,0);
const catOf=m=>(m.is_new?(m.is_family?'D':'C'):(m.is_family?'B':'A'));
const CATN={A:'A 原社友',B:'B 原社友直系寶眷',C:'C 新社友',D:'D 新社友直系寶眷'};
function tiles(){
  const act=MEM.filter(m=>m.active);
  const exp=act.reduce((s,m)=>s+needSum(m),0);
  const conf=DUES.filter(d=>d.status==='已確認');
  const adOf=d=>d.items.filter(c=>KIND[c]==='ad').reduce((s,c)=>s+AMT[c],0);
  const confAll=conf.reduce((s,d)=>s+d.amount,0),confAd=conf.reduce((s,d)=>s+adOf(d),0),confDues=confAll-confAd;
  const pend=DUES.filter(d=>d.status==='待審核');
  const pendAmt=pend.reduce((s,d)=>s+d.amount,0);
  const full=act.filter(m=>m.need.every(x=>m.paid_items.includes(x.code))).length;
  const pct=exp?Math.min(100,Math.round(confDues/exp*100)):0;
  $('tiles').innerHTML=[
    ['待審核',pend.length+' 筆',money(pendAmt)],
    ['社費已確認',money(confDues),'佔應收 '+pct+'%'],
    ['應收社費',money(exp),'在籍 '+act.length+' 人'],
    ['已繳齊',full+' 人','尚未繳齊 '+(act.length-full)+' 人'],
    ['廣告費已確認',money(confAd),'選填贊助']
  ].map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  $('barfill').style.width=pct+'%';
  $('barlab').textContent=`社費已確認 ${money(confDues)} ／ 應收 ${money(exp)}（${pct}%）。待審核 ${money(pendAmt)}、廣告費 ${money(confAd)} 另計，不在此比例內。`;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
function show(t){
  TAB=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  ['pending','all','matrix','add','set'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==t));
  if(t==='pending')renderPending();if(t==='all')renderAll();if(t==='matrix')renderMx();if(t==='set')renderSet();
}
const items=d=>d.items.map(c=>LABEL[c]||c).join('、');
function renderPending(){
  const p=DUES.filter(d=>d.status==='待審核').sort((a,b)=>a.submitted_at<b.submitted_at?-1:1);
  $('v-pending').innerHTML=p.length?p.map(d=>`<div class="rv" id="r${d.id}">
    <div class="h"><span class="nm">${esc(d.member_name)}</span><span class="amt">${money(d.amount)}</span></div>
    <dl class="kv"><dt>項目</dt><dd>${esc(items(d))}</dd><dt>方式</dt><dd>${esc(d.method)}${d.method==='匯款'?'　後5碼 <b>'+esc(d.last5)+'</b>':''}</dd><dt>繳費日</dt><dd>${esc(d.paid_date)}</dd><dt>回報時間</dt><dd>${esc(fmtTime(d.submitted_at))}</dd>${d.note?`<dt>備註</dt><dd>${esc(d.note)}</dd>`:''}</dl>
    <div class="row"><input type="text" class="grow" id="n${d.id}" placeholder="備註／退回原因（退回必填）" maxlength="200">
    <button class="sm ok" onclick="act(${d.id},'已確認')">確認收款</button><button class="sm bad" onclick="act(${d.id},'退回')">退回</button></div>
    <div id="e${d.id}"></div></div>`).join(''):'<div class="card muted">目前沒有待審核的回報。</div>';
}
async function act(id,s){
  const rn=$('n'+id).value.trim();
  if(s==='退回'&&!rn){$('e'+id).innerHTML='<div class="msg err">退回請填寫原因</div>';return}
  try{await rpc('imc_dues_review',{p:PW,i:id,s,rn});await reload()}
  catch(e){$('e'+id).innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
function renderAll(){
  const st=$('fs').value,q=$('fq').value.trim();
  const rows=DUES.filter(d=>(!st||d.status===st)&&(!q||(d.member_name+d.last5+d.note+d.receipt_no).includes(q)));
  $('tAll').innerHTML=`<thead><tr><th>狀態</th><th>社友</th><th>項目</th><th class="n">金額</th><th>方式</th><th>後5碼</th><th>繳費日</th><th>回報</th><th>收據</th><th>備註</th><th></th></tr></thead><tbody>`+
   rows.map(d=>`<tr><td><span class="pill ${esc(d.status)}">${esc(d.status)}</span></td><td>${esc(d.member_name)}</td><td>${esc(items(d))}</td><td class="n">${d.amount.toLocaleString('en-US')}</td><td>${esc(d.method)}</td><td>${esc(d.last5)}</td><td>${esc(d.paid_date)}</td><td>${esc(fmtTime(d.submitted_at))}<br><small class="muted">${esc(d.entered_by)}</small></td><td>${esc(d.receipt_no)}</td><td>${esc(d.review_note||d.note)}</td><td>${d.status!=='待審核'?`<button class="sm" onclick="reopen(${d.id})">改回待審</button>`:''}</td></tr>`).join('')+'</tbody>';
  if(!rows.length)$('tAll').innerHTML+='<caption class="muted" style="padding:14px">沒有符合的紀錄</caption>';
}
async function reopen(id){
  if(!confirm('把這筆改回「待審核」？'))return;
  try{await rpc('imc_dues_review',{p:PW,i:id,s:'待審核',rn:''});await reload()}catch(e){alert(e.message)}
}
$('fs').addEventListener('change',renderAll);$('fq').addEventListener('input',renderAll);
const DUESCODES=()=>FEES.filter(f=>f.kind==='dues');
function mrows(){
  const f=$('mf').value,q=$('mq').value.trim();
  return MEM.filter(m=>m.active&&(!q||m.name.includes(q))).map(m=>{
    const cells=m.need.map(x=>m.paid_items.includes(x.code)?'已確認':m.pending_items.includes(x.code)?'待審核':'未繳');
    const owe=m.need.reduce((s,x,i)=>s+(cells[i]==='已確認'?0:x.amount),0);
    const ad=m.paid_items.filter(c=>KIND[c]==='ad').reduce((s,c)=>s+AMT[c],0);
    return {m,cells,owe,ad,done:cells.every(c=>c==='已確認'),pend:cells.includes('待審核'),unpaid:cells.includes('未繳')};
  }).filter(r=>!f||(f==='unpaid'&&r.unpaid)||(f==='done'&&r.done)||(f==='pend'&&r.pend));
}
function cellOf(r,code){const i=r.m.need.findIndex(x=>x.code===code);return i<0?null:r.cells[i]}
function renderMx(){
  const r=mrows(),dc=DUESCODES();
  $('tMx').innerHTML=`<thead><tr><th>社友</th><th>類別</th>${dc.map(f=>`<th>${esc(f.label.replace(/（.*/,''))}</th>`).join('')}<th class="n">尚欠</th><th class="n">廣告費</th></tr></thead><tbody>`+
  r.map(x=>`<tr><td>${esc(x.m.name)}</td><td>${catOf(x.m)}${x.m.annual_override?' <small class="muted">調整</small>':''}</td>${dc.map(f=>{const c=cellOf(x,f.code);return `<td>${c?`<span class="pill ${c}">${c}</span>`:'<span class="muted">—</span>'}</td>`}).join('')}<td class="n">${x.owe.toLocaleString('en-US')}</td><td class="n">${x.ad?x.ad.toLocaleString('en-US'):''}</td></tr>`).join('')+'</tbody>';
}
$('mf').addEventListener('change',renderMx);$('mq').addEventListener('input',renderMx);
function csvDl(name,rows){
  const c=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+c],{type:'text/csv'}));a.download=name;a.click();
}
$('csv').addEventListener('click',()=>csvDl('社費回報紀錄.csv',[['狀態','社友','項目','金額','方式','後5碼','繳費日','回報時間','來源','收據編號','備註','審核備註']].concat(DUES.map(d=>[d.status,d.member_name,items(d),d.amount,d.method,d.last5,d.paid_date,d.submitted_at,d.entered_by,d.receipt_no,d.note,d.review_note]))));
$('mcsv').addEventListener('click',()=>{const r=mrows(),dc=DUESCODES();csvDl('社費繳費總表.csv',[['社友','類別',...dc.map(f=>f.label),'尚欠','廣告費已收']].concat(r.map(x=>[x.m.name,CATN[catOf(x.m)],...dc.map(f=>cellOf(x,f.code)||'—'),x.owe,x.ad])))});
/* 代登 */
let AF=[];
$('an').addEventListener('input',async()=>{
  const n=$('an').value.trim();
  if(!MEM.some(m=>m.name===n&&m.active)){AF=[];$('aitems').innerHTML='<div class="muted">先選社友，系統會依其類別列出項目與金額。</div>';asum();return}
  try{AF=await rpc('imc_fees_for',{n});
    $('aitems').innerHTML=`<div class="muted">類別：<b>${esc(AF[0]?AF[0].cat:'')}</b></div>`+AF.map(f=>`<label class="opt"><input type="checkbox" value="${f.code}"><span class="l">${esc(f.label)}</span><span class="a">${money(f.amount)}</span></label>`).join('');asum()}
  catch(e){$('aitems').innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
});
function asum(){let s=0;document.querySelectorAll('#aitems input').forEach(i=>{i.closest('.opt').classList.toggle('on',i.checked);if(i.checked)s+=AF.find(f=>f.code===i.value).amount});$('asum').textContent=money(s)}
$('aitems').addEventListener('change',asum);
$('addf').addEventListener('submit',async e=>{
  e.preventDefault();const it=[...document.querySelectorAll('#aitems input:checked')].map(i=>i.value);const o=$('aout');
  if(!$('an').value||!it.length){o.innerHTML='<div class="msg err">請選社友並勾選項目</div>';return}
  try{await rpc('imc_dues_add',{p:PW,n:$('an').value.trim(),m:document.querySelector('input[name=am]:checked').value,it,l5:$('al5').value.trim(),d:$('ad').value,nt:$('ant').value});
    o.innerHTML='<div class="msg ok">已登錄並確認。</div>';$('an').value='';$('an').dispatchEvent(new Event('input'));$('ant').value='';$('al5').value='';await reload()}
  catch(err){o.innerHTML=`<div class="msg err">${esc(err.message)}</div>`}
});
/* 設定 */
function renderSet(){
  const q=$('sq').value.trim(),off=$('sact').checked;
  const rows=MEM.filter(m=>(!q||m.name.includes(q))&&(!off||!m.active));
  $('tSet').innerHTML=`<thead><tr><th>社友</th><th>類別</th><th>年費調整</th><th>在籍</th></tr></thead><tbody>`+rows.map((m,i)=>`<tr data-n="${esc(m.name)}"><td>${esc(m.name)}</td>
   <td><select class="sc">${['A','B','C','D'].map(c=>`<option value="${c}" ${catOf(m)===c?'selected':''}>${CATN[c]}</option>`).join('')}</select></td>
   <td><input type="text" class="so" inputmode="numeric" style="width:96px;min-height:40px" value="${m.annual_override||''}" placeholder="預設"></td>
   <td><input type="checkbox" class="sa" ${m.active?'checked':''} style="width:22px;height:22px;accent-color:var(--gold-deep)"></td></tr>`).join('')+'</tbody>';
}
$('sq').addEventListener('input',renderSet);$('sact').addEventListener('change',renderSet);
async function saveRow(tr){
  const n=tr.dataset.n,c=tr.querySelector('.sc').value,ov=tr.querySelector('.so').value.trim(),act=tr.querySelector('.sa').checked;
  if(ov&&!/^[1-9][0-9]{0,5}$/.test(ov)){$('sout').innerHTML='<div class="msg err">年費調整請填數字，或留空用預設</div>';return}
  try{await rpc('imc_member_save',{p:PW,n,newm:c==='C'||c==='D',fam:c==='B'||c==='D',ovr:ov?+ov:null,act});
    $('sout').innerHTML=`<div class="msg ok">已儲存 ${esc(n)}</div>`;
    [DUES,MEM]=await Promise.all([rpc('imc_dues_list',{p:PW}),rpc('imc_admin_members',{p:PW})]);tiles();
    $('anl').innerHTML=MEM.filter(m=>m.active).map(m=>`<option value="${esc(m.name)}">`).join('');}
  catch(err){$('sout').innerHTML=`<div class="msg err">${esc(err.message)}</div>`}
}
$('tSet').addEventListener('change',e=>{const tr=e.target.closest('tr[data-n]');if(tr)saveRow(tr)});
$('savepay').addEventListener('click',async()=>{try{await rpc('imc_set_pay_info',{p:PW,v:$('payinfo').value});$('pout').innerHTML='<div class="msg ok">已儲存。</div>'}catch(e){$('pout').innerHTML=`<div class="msg err">${esc(e.message)}</div>`}});
$('mf2').addEventListener('submit',async e=>{e.preventDefault();const c=$('mt').value;try{await rpc('imc_member_save',{p:PW,n:$('mn').value,newm:c==='C'||c==='D',fam:c==='B'||c==='D',ovr:null,act:true});$('mout').innerHTML='<div class="msg ok">已新增。</div>';$('mn').value='';await reload()}catch(err){$('mout').innerHTML=`<div class="msg err">${esc(err.message)}</div>`}});
if(PW){boot().catch(()=>{PW='';try{sessionStorage.removeItem('imc_fin')}catch(e){}})}
</script>
</body>
</html>
