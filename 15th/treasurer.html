<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>財務後台 | 苗栗IMC 第15屆</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/style.css">
<style>
.grp{flex:none;align-self:center;font-size:12px;font-weight:700;color:var(--gold-deep);padding:0 4px 0 8px;letter-spacing:.04em}
.grp:first-child{padding-left:0}
.sep{flex:none;width:1px;background:var(--line);margin:6px 6px}
iframe.pane{display:block;width:100%;border:0;min-height:320px;background:transparent}
.tabs button.on,.tabs button[aria-selected="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.stick{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.stick .tabs{position:static;border-bottom:0}
.gsw{display:none;gap:8px;padding:8px 0 0}
.gsw button{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink-strong);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.gsw button[aria-selected="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.gsw{display:flex}
.stick .tabs{flex-wrap:wrap;overflow:visible;gap:6px;padding:8px 0}
.stick .tabs .grp,.stick .tabs .sep{display:none}
.stick .tabs button[hidden]{display:none}
.gsw button small{display:none;font-size:12px;font-weight:400;opacity:.8;margin-top:2px}
.gsw button{position:relative}.gsw button em{font-style:normal;background:#c0392b;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;line-height:18px;position:absolute;top:-6px;right:-4px;min-width:18px;text-align:center}
@media (min-width:701px){.gsw button{flex:none;min-width:170px;padding:8px 24px;font-size:17px}.gsw button small{display:block}}
@media (max-width:700px){.gsw{gap:6px}.gsw button{padding:12px 2px;font-size:14.5px}.gsw button .n{white-space:nowrap}.stick .tabs button{padding:8px 10px;min-height:40px;font-size:15px}.stick .tabs{gap:5px}}
</style>
</head>
<body>
<header class="top"><div class="wrap wide">
  <div class="brand">
    <img src="assets/imc-logo.png" alt="苗栗IMC 社徽" onerror="this.style.display='none'">
    <div class="t"><div class="org">社團法人苗栗縣國際工商經營研究社</div><h1>財務後台・第15屆</h1></div>
    <button class="sm hide" id="logout">登出</button>
  </div>
</div><hr class="rule"></header>

<main class="wrap wide">
  <form class="card" id="login" style="max-width:420px;margin-inline:auto">
    <h2>財務長登入</h2>
    <label class="f" for="pw">密碼</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" type="submit">登入</button><div id="lerr"></div>
  </form>

  <section id="app" class="hide">
    <div class="stick">
    <div class="gsw" id="gsw"><button data-g="f"><span class="n">收入審查</span><small>社友繳費・收款確認</small></button><button data-g="e"><span class="n">支出審查</span><small>理監事報帳・入帳</small></button><button data-g="w"><span class="n">帳務報表</span><small>預算・收支帳・匯出</small></button><button data-g="h"><span class="n">小幫手</span><small>問答・提醒・知識庫</small></button></div>
    <div class="tabs" role="tablist" id="tabs" data-g="f">
      <button role="tab" data-g="f" data-t="pending">待審核</button>
      <button role="tab" data-g="f" data-t="all">全部收款</button>
      <button role="tab" data-g="f" data-t="matrix">繳費總表</button>
      <button role="tab" data-g="f" data-t="add">代登收款</button>
      <button role="tab" data-g="f" data-t="set">收費設定</button>
      <button role="tab" data-g="e" data-t="cpend">待入帳</button>
      <button role="tab" data-g="e" data-t="call">全部報帳</button>
      <button role="tab" data-g="e" data-t="cset">名單與維護</button>
      <button role="tab" data-g="w" data-t="ov">預算執行</button>
      <button role="tab" data-g="w" data-t="lg">收支帳</button>
      <button role="tab" data-g="w" data-t="bd">預算編列</button>
      <button role="tab" data-g="w" data-t="ex">匯出報表</button>
      <button role="tab" data-g="h" data-t="ask">問問看</button>
      <button role="tab" data-g="h" data-t="kb">知識庫</button>
    </div>
    </div>
    <iframe class="pane hide" id="pf" title="收支審查"></iframe>
    <iframe class="pane hide" id="pw2" title="財務工作台"></iframe>
    <iframe class="pane hide" id="ph" title="社務小幫手"></iframe>
  </section>
</main>

<script src="assets/api.js"></script>
<script>
const $=id=>document.getElementById(id);
let PW='';try{PW=sessionStorage.getItem('imc_fin')||''}catch(e){}
let G='f',T={f:'pending',e:'cpend',w:'ov',h:'ask'},loaded=false,CNT={inc:0,exp:0};
const frames={f:$('pf'),e:$('pf'),w:$('pw2'),h:$('ph')};
const V=Date.now();const srcs={f:'finance.html?embed=1&v='+V,w:'workbench.html?embed=1&v='+V,h:'helper.html?embed=1&v='+V};
async function enter(){
  await rpc('imc_dues_list',{p:PW});          /* 驗證密碼 */
  try{sessionStorage.setItem('imc_fin',PW)}catch(e){}
  $('login').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');
  if(!loaded){loaded=true;['f','w','h'].forEach(k=>{frames[k].addEventListener('load',()=>{frames[k].dataset.ready=1;const q=frames[k]._q;if(q)setTimeout(()=>{try{frames[k].contentWindow.postMessage(q,location.origin)}catch(e){}},400)});frames[k].src=srcs[k]})}
  go(G,T[G],false);
}
function go(g,t,reload){
  G=g;T[g]=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.g===g&&b.dataset.t===t));
  $('tabs').dataset.g=g;document.querySelectorAll('#tabs button').forEach(b=>b.hidden=b.dataset.g!==g);document.querySelectorAll('#gsw button').forEach(b=>b.setAttribute('aria-selected',b.dataset.g===g));
  frames.f.classList.toggle('hide',g==='w'||g==='h');frames.w.classList.toggle('hide',g!=='w');frames.h.classList.toggle('hide',g!=='h');
  const fr=frames[g];const msg={show:t};if(reload)msg.reload=1;
  if(fr.dataset.ready){fr._q=null;try{fr.contentWindow.postMessage(msg,location.origin)}catch(e){}}else fr._q=msg;
}
function badge(){
  const set=(sel,n,base)=>{const el=document.querySelector(sel);if(el)el.textContent=n?base+'（'+n+'）':base};
  set('#tabs [data-t=pending]',CNT.inc,'待審核');set('#tabs [data-t=cpend]',CNT.exp,'待入帳');
  document.querySelectorAll('#gsw button[data-g=f] em,#gsw button[data-g=e] em').forEach(x=>x.remove());
  [['f',CNT.inc],['e',CNT.exp]].forEach(([g,n])=>{if(n){const em=document.createElement('em');em.textContent=n;document.querySelector('#gsw button[data-g='+g+'] .n').after(em)}});
}
$('gsw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=b.dataset.g;if(g!==G)go(g,T[g],true)});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=b.dataset.g;go(g,b.dataset.t,g!==G)});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.counts){CNT=d.counts;badge();return}if(d.goto){go(d.goto.g,d.goto.t,d.goto.g!==G);return}if(!d.h)return;const fr=/workbench/.test(d.from)?frames.w:/helper/.test(d.from)?frames.h:frames.f;fr.style.height=d.h+'px'});
$('login').addEventListener('submit',async e=>{e.preventDefault();PW=$('pw').value;$('lerr').innerHTML='';
  try{await enter()}catch(err){PW='';$('lerr').innerHTML=`<div class="msg err">${esc(err.message)}</div>`}});
$('logout').addEventListener('click',()=>{PW='';try{sessionStorage.removeItem('imc_fin')}catch(e){}location.reload()});
if(PW){enter().catch(()=>{PW='';try{sessionStorage.removeItem('imc_fin')}catch(e){}})}
</script>
</body>
</html>
