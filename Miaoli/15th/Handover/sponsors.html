 {item:'星月寶萊舞團演出節目、音響設備',who:[['社長','林浿安','EX-亞洲劇團']]},
 {item:'拍照背板＋大圖輸出',who:[['秘書長','趙震謙','順立印刷']]},
 {item:'投影設備一式（活動當天）',who:[['社友','徐志勳','贏幕科技股份有限公司']]},
 {item:'排桌座位系統＋交接活動網頁',who:[['第十二屆社長／常務監事','梁群儒','米樂家國際貿易有限公司'],['社友','張廖欣儀','米樂家國際貿易有限公司']]}
];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=ADS.map(a=>Object.assign({thumb:'assets/ads/'+a.id+'_s.jpg',full:'assets/ads/'+a.id+'.jpg'},a));
let cur=0;
function renderS(){
  document.getElementById('n').textContent=S.length;
  document.getElementById('grid').innerHTML=S.map((x,i)=>'<button type="button" class="edm" onclick="openOv('+i+')" aria-label="放大 '+esc(x.title)+' 的廣告"><div class="img">'+(x.thumb?'<img src="'+esc(x.thumb)+'" alt="'+esc(x.title)+' 廣告" loading="lazy">':'EDM')+'</div><div class="cap"><div class="lbl" style="font-size:13px">'+esc(x.tier)+'</div><div class="serif" style="font-size:19px;font-weight:700;color:var(--dark);line-height:1.35">'+esc(x.title)+'</div><div class="note">'+esc((x.role?x.role+'　':'')+x.member)+'</div></div></button>').join('');
}
function renderThanks(){
  let h='<h3 class="serif">特刊廣告與贊助</h3><div class="note" style="margin-bottom:4px">特此感謝 IMC 優質廠商鼎力贊助年會特刊印製</div>';
  TH_AD.forEach(g=>{h+='<div class="sub">'+esc(g[0])+'</div>'+g[1].map(r=>'<div class="r"><div class="l">'+esc(r[0])+'　'+esc(r[1])+'</div><div>'+(r[2]?esc(r[2]):'<span class="note">—</span>')+'</div></div>').join('');});
  document.getElementById('th-ad').innerHTML=h;
  const blk=(id,title,note,arr)=>{document.getElementById(id).innerHTML='<h3 class="serif">'+title+'</h3>'+(note?'<div class="note" style="margin-bottom:4px">'+note+'</div>':'')+arr.map(r=>'<div class="r"><div class="it">'+esc(r.item)+'</div><div class="who">'+r.who.map(p=>'<div><b>'+esc(p[1])+'</b><span class="rl">'+esc(p[0])+'</span>'+(p[2]?'<span class="co">'+esc(p[2])+'</span>':'')+'</div>').join('')+'</div></div>').join('');};
  blk('th-gift','年會伴手禮','感謝下列愛心爆滿的大德鼎力贊助年會伴手禮',TH_GIFT);
  blk('th-drink','飲品／點心','',TH_DRINK);
  blk('th-show','節目／設備','',TH_SHOW);
}
function openOv(i){
  cur=i;const x=S[i];
  document.getElementById('ovImg').innerHTML=x.full?'<img src="'+esc(x.full)+'" alt="'+esc(x.title)+' 廣告">':'<div style="padding:60px 0;color:var(--muted2)">EDM</div>';
  document.getElementById('ovTier').textContent=x.tier;
  document.getElementById('ovTitle').textContent=x.title;
  document.getElementById('ovMember').textContent=(x.role?x.role+'　':'')+x.member+' 贊助';
  document.getElementById('ovDesc').textContent=x.desc||'';
  const a=document.getElementById('ovLink'),lk=/^https?:\/\//i.test(x.link||'')?x.link:'';a.href=lk||'#';a.style.display=lk?'':'none';
  const o=document.getElementById('ovOrig');o.href=x.full||'#';o.style.display=x.full?'':'none';
  const box=document.querySelector('#ov .box');box.scrollTop=0;
  document.getElementById('ov').classList.add('show');
}
function nav(d){openOv((cur+d+S.length)%S.length);}
function closeOv(){document.getElementById('ov').classList.remove('show');}
document.addEventListener('keydown',e=>{const on=document.getElementById('ov').classList.contains('show');if(e.key==='Escape')closeOv();if(on&&e.key==='ArrowLeft')nav(-1);if(on&&e.key==='ArrowRight')nav(1);});
renderS();renderThanks();
/* 承辦團隊若在後台另外登錄 EDM（贊助廣告），會接在特刊廣告之後顯示 */
(async()=>{try{const rows=await dbGet('h15_products?on_shelf=eq.true&cat=eq.贊助廣告&select=*&order=id');
  rows.forEach(r=>{S.push({tier:'年會贊助',role:'',member:r.seller||'',title:r.title||r.name||'',desc:r.descr||'',link:r.link||'',thumb:r.img||'',full:r.img||''});});
  if(rows.length)renderS();}catch(e){}})();
</script>
